<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Ceekay - Reset Password</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: "Poppins", Arial, sans-serif;
            background:
                linear-gradient(to right, rgba(184, 138, 68, 0.35), rgba(20, 14, 6, 0.80)),
                url("img/african fashion.jpg") center / cover no-repeat fixed;
        }
        .reset-wrap { width: 100%; max-width: 480px; padding: 44px 34px 36px; color: #fff; }
        .reset-wrap h1 { color: #fff; font-weight: 600; font-size: 1.55rem; margin: 0 0 6px; text-shadow: 2px 2px 8px rgba(0,0,0,.9), 0 0 4px #000; }
        .reset-wrap p.sub { color: #fff; font-size: .85rem; margin: 0 0 20px; text-shadow: 1px 1px 6px rgba(0,0,0,.9); }
        .reset-wrap form { display: flex; flex-direction: column; gap: 14px; }
        .reset-wrap input {
            width: 100%; box-sizing: border-box; border: none; outline: none;
            padding: 13px 20px; font: inherit; font-size: 13px; color: #333;
            background: #fff; border-radius: 30px; box-shadow: 0 4px 12px rgba(0,0,0,.45);
        }
        .reset-wrap input::placeholder { color: #9a9a9a; }
        .reset-wrap button {
            border: none; border-radius: 30px; padding: 14px 24px; margin-top: 4px;
            background: var(--gold, #b88a44); color: #fff; font: inherit; font-size: 13px;
            font-weight: 600; letter-spacing: .5px; text-transform: uppercase; cursor: pointer;
            box-shadow: 0 4px 12px rgba(0,0,0,.4); transition: background .25s ease;
        }
        .reset-wrap button:hover { background: #9d7335; }
        .reset-wrap button:disabled { opacity: .6; cursor: default; }
        .reset-msg { color: #fff; margin-top: 16px; font-size: 14px; min-height: 20px; text-shadow: 1px 1px 6px rgba(0,0,0,.9); }
        .reset-msg.err { color: #ffb4a3; }
        .reset-msg.ok { color: #cdeecb; }
        .reset-wrap a { color: #f1d9b6; font-weight: 600; text-decoration: none; text-shadow: 1px 1px 6px rgba(0,0,0,.9); }
        .reset-wrap a:hover { text-decoration: underline; }
    </style>
</head>

<body>
    <div class="reset-wrap">
        <h1 id="reset-title">Set a new password</h1>
        <p class="sub" id="reset-sub">Choose a new password for your account.</p>

        <form id="reset-form">
            <input type="password" id="new-password" placeholder="New password (min 8 characters)" minlength="8" required autocomplete="new-password">
            <input type="password" id="confirm-password" placeholder="Confirm new password" minlength="8" required autocomplete="new-password">
            <button type="submit" id="reset-submit">Update password</button>
        </form>

        <p class="reset-msg" id="reset-msg"></p>
        <p><a id="reset-back" href="index.html">&larr; Back</a></p>
    </div>

    <script src="config.js"></script>
    <script>
        (function () {
            const params = new URLSearchParams(location.search);
            const token = params.get('token');
            const isAdmin = params.get('type') === 'admin';

            const form = document.getElementById('reset-form');
            const msg = document.getElementById('reset-msg');
            const submitBtn = document.getElementById('reset-submit');
            const back = document.getElementById('reset-back');

            back.href = isAdmin ? 'admin.html' : 'index.html';
            back.textContent = isAdmin ? '← Back to admin login' : '← Back to store';
            if (isAdmin) {
                document.getElementById('reset-sub').textContent = 'Choose a new password for your admin account.';
            }

            if (!token) {
                form.style.display = 'none';
                msg.className = 'reset-msg err';
                msg.textContent = 'This page needs a reset link. Request one from the "Forgot password?" link.';
                return;
            }

            form.addEventListener('submit', async function (e) {
                e.preventDefault();
                msg.textContent = '';
                msg.className = 'reset-msg';

                const pw = document.getElementById('new-password').value;
                const confirm = document.getElementById('confirm-password').value;

                if (pw.length < 8) {
                    msg.className = 'reset-msg err';
                    msg.textContent = 'Password must be at least 8 characters.';
                    return;
                }
                if (pw !== confirm) {
                    msg.className = 'reset-msg err';
                    msg.textContent = 'Passwords do not match.';
                    return;
                }

                const endpoint = isAdmin ? '/api/admin/reset-password' : '/api/auth/reset-password';
                submitBtn.disabled = true;
                try {
                    const data = await apiFetch(endpoint, { method: 'POST', body: { token: token, password: pw } });
                    form.style.display = 'none';
                    msg.className = 'reset-msg ok';
                    msg.textContent = (data && data.message) || 'Password updated. You can now log in.';
                    back.textContent = isAdmin ? 'Go to admin login →' : 'Go to store →';
                } catch (err) {
                    submitBtn.disabled = false;
                    msg.className = 'reset-msg err';
                    msg.textContent = err.message || 'Could not reset the password.';
                }
            });
        })();
    </script>
</body>

</html>
